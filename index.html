<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demiurge</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0f14;
        color: #cfd3dc;
        font-family: Georgia, "Times New Roman", serif;
      }
      #app {
        display: flex;
        height: 100%;
      }
      #view {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      #map {
        display: block;
        width: 100%;
        height: 100%;
      }
      #map.verb {
        cursor: crosshair;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 6px;
        background: #0d0f14cc;
        padding: 6px 8px;
        border-radius: 6px;
      }
      #controls .sep {
        width: 1px;
        background: #3a3f4c;
        margin: 0 4px;
      }
      #controls button {
        background: #1c202b;
        color: #cfd3dc;
        border: 1px solid #3a3f4c;
        border-radius: 4px;
        padding: 4px 10px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      #controls button:hover {
        background: #2a2f3d;
      }
      #controls button.active {
        background: #4a5568;
        border-color: #8b95a8;
      }
      #pace {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #8b95a8;
      }
      #pace input {
        width: 90px;
        accent-color: #8b95a8;
        direction: rtl; /* left = slow, right = fast */
      }
      #tick-label {
        min-width: 34px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #date {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: #0d0f14cc;
        padding: 4px 10px;
        border-radius: 6px;
        font-style: italic;
      }
      #log {
        width: 320px;
        border-left: 1px solid #2a2f3d;
        display: flex;
        flex-direction: column;
        background: #12141b;
      }
      #log h2 {
        margin: 0;
        padding: 12px 16px 8px;
        font-size: 16px;
        font-weight: normal;
        font-variant: small-caps;
        letter-spacing: 2px;
        color: #8b95a8;
        border-bottom: 1px solid #2a2f3d;
      }
      #entries {
        flex: 1;
        overflow-y: auto;
        padding: 8px 16px 16px;
        font-size: 13px;
        line-height: 1.5;
      }
      #entries .entry {
        margin-top: 8px;
      }
      #entries .when {
        color: #6b7280;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="view">
        <canvas id="map"></canvas>
        <div id="controls">
          <button id="btn-pause" data-batch="0" title="Pause">⏸</button>
          <button id="btn-season" data-batch="1" title="One season per step">Season</button>
          <button id="btn-year" data-batch="4" title="One year per step">Year</button>
          <button id="btn-decade" data-batch="40" title="One decade per step">Decade</button>
          <label id="pace" title="Seconds between sim steps">
            <input type="range" id="tick-ms" />
            <span id="tick-label"></span>
          </label>
          <span class="sep"></span>
          <button id="btn-observe" title="Watch the world">Observe</button>
          <button id="btn-bless" title="Bless the fertility of a region">Bless</button>
          <button id="btn-warm" title="Breathe warmth over a region">Warm</button>
          <button id="btn-cool" title="Draw a chill across a region">Cool</button>
          <span class="sep"></span>
          <button id="btn-ov-terrain" title="Terrain view">Map</button>
          <button id="btn-ov-temperature" title="Debug: temperature">T°</button>
          <button id="btn-ov-moisture" title="Debug: moisture">Moist</button>
          <button id="btn-ov-fertility" title="Debug: fertility">Fert</button>
        </div>
        <div id="date"></div>
      </div>
      <div id="log">
        <h2>Chronicle</h2>
        <div id="entries"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
